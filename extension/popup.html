<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ScamShield</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; width: 340px; padding: 16px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(120% 90% at 0% 0%, #1b1f4a 0%, #0a0c1c 60%);
        color: #e8eaf6;
      }
      .row { display: flex; align-items: center; gap: 10px; }
      .logo { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
        background: linear-gradient(135deg, #6366f1, #a855f7); font-weight: 800; color: #fff; }
      .brand { font-weight: 800; letter-spacing: -0.01em; }
      .muted { color: #9aa0c0; font-size: 11.5px; }
      .card { margin-top: 12px; border-radius: 16px; padding: 14px;
        background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
      input { width: 100%; border-radius: 11px; padding: 9px 11px; font-size: 12.5px; color: #e8eaf6;
        background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); outline: none; }
      button { cursor: pointer; border: 0; border-radius: 11px; padding: 9px 12px; font-weight: 700; font-size: 12.5px;
        color: #fff; background: linear-gradient(135deg, #6366f1, #a855f7); }
      button.ghost { color: #e8eaf6; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); }
      .score { font-size: 30px; font-weight: 900; line-height: 1; }
      ul { margin: 10px 0 0; padding-left: 17px; font-size: 12px; line-height: 1.55; color: #c9cde8; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
      .stat { border-radius: 12px; padding: 9px 11px; background: rgba(255,255,255,.05);
        border: 1px solid rgba(255,255,255,.09); }
      .stat b { display: block; font-size: 17px; }
      a { color: #a5b4fc; font-size: 11.5px; text-decoration: none; }
      .toggle { margin-left: auto; font-size: 11.5px; }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="logo">S</div>
      <div>
        <div class="brand">ScamShield</div>
        <div class="muted">Real-time scam protection</div>
      </div>
      <label class="toggle row"><input type="checkbox" id="enabled" style="width:auto" /> On</label>
    </div>

    <div class="card">
      <div class="muted" id="current">Checking this tab…</div>
      <div class="row" style="margin-top: 8px">
        <div class="score" id="score">–</div>
        <div>
          <div id="level" style="font-weight: 800">Scanning</div>
          <div class="muted" id="host"></div>
        </div>
      </div>
      <ul id="findings"></ul>
    </div>

    <div class="card">
      <div class="muted" style="margin-bottom: 8px">Check any link or message</div>
      <input id="target" placeholder="paste a URL or SMS text" />
      <div class="row" style="margin-top: 8px">
        <button id="scan" style="flex: 1">Scan</button>
        <button id="open" class="ghost">Open app</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="muted">Links checked</span><b id="scanned">0</b></div>
      <div class="stat"><span class="muted">Threats blocked</span><b id="blocked">0</b></div>
    </div>

    <div style="margin-top: 12px; text-align: center">
      <a href="#" id="dash">Open ScamShield dashboard →</a>
    </div>

    <script src="analyze.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
